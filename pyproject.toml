[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracely"
version = "0.1.0"
description = "Lightweight observability SDK for Python web frameworks"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-api>=1.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tracely"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
